name: Release Ubuntu Package

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-and-release:
    name: Build and Release Ubuntu Package
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@v1
      with:
        toolchain: stable
        target: x86_64-unknown-linux-gnu

    - name: Build Ubuntu tar package
      run: |
        chmod +x build-ubuntu-tar.sh
        ./build-ubuntu-tar.sh

    - name: Show package info
      run: |
        ls -la releases/
        tar -tzf releases/tcping_*.tar.gz

    - name: Create Release
      uses: softprops/action-gh-release@v1
      with:
        files: releases/tcping_*.tar.gz
        generate_release_notes: true
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}